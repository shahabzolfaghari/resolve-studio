name: Deploy Landing Page to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI & Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          mkdir -p .deploy_dist/public/screenshots .deploy_dist/screenshots
          cp index.html vercel.json .deploy_dist/
          cp public/screenshots/*.png .deploy_dist/public/screenshots/
          cp public/screenshots/*.png .deploy_dist/screenshots/
          cd .deploy_dist
          vercel whoami --token "$VERCEL_TOKEN"
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "DEPLOYED_URL=$URL"
