<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10" />
    </linearGradient>
  </defs>
  <!-- Background Disc with Subtle Depth -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- Outer Calibration Ring -->
  <circle cx="256" cy="256" r="216" stroke="url(#ringGrad)" stroke-width="6" fill="none" />
  <circle cx="256" cy="256" r="198" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 12" fill="none" />
  
  <!-- Internal Reticle Ring -->
  <circle cx="256" cy="256" r="162" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none" />
  
  <!-- Signature Lowercase 'r' in Italic Serif -->
  <text x="246" y="344" text-anchor="middle" fill="#FFFFFF" font-family="'Georgia', 'Instrument Serif', serif" font-style="italic" font-size="300" font-weight="400">r</text>
  
  <!-- S24 Amber Log Indicator Pip -->
  <circle cx="366" cy="146" r="14" fill="#D97706" />
  <circle cx="366" cy="146" r="22" stroke="#D97706" stroke-opacity="0.4" stroke-width="3" fill="none" />
</svg>